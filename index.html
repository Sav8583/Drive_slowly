<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Endless Open Highway</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Three.js and Perlin Noise library via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.min.js"></script>
</head>
<body>
  <!-- HUD / Dashboard -->
  <div id="hud">
    <div class="speed-cluster">
      <span id="speedVal">0</span>
      <span class="unit">KM/H</span>
    </div>
    <div class="gear-indicator" id="gearVal">D</div>
    <div class="keys-tip">WASD / Arrows to Drive &bull; C: Change View &bull; Space: Handbrake</div>
  </div>

  <!-- On-Screen Touch / Click Controls for Mobile & Laptop -->
  <div id="mobile-controls">
    <div class="control-dpad">
      <button class="btn" id="btn-left">◀</button>
      <button class="btn" id="btn-right">▶</button>
    </div>
    <div class="control-pedals">
      <button class="btn pedal brake" id="btn-brake">BRAKE</button>
      <button class="btn pedal gas" id="btn-gas">GAS</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
