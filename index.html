<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Night Jungle Drive</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- HUD -->
  <div id="hud">
    <div class="speed-cluster">
      <span id="speedVal">0</span>
      <span class="unit">KM/H</span>
    </div>
    <div class="sub-info">
      <span id="gearVal">D</span> &bull; <span id="vehName">RED CAR</span>
    </div>
    <button id="btn-switch" class="switch-btn">🔄 SWITCH VEHICLE (V)</button>
  </div>

  <!-- Touch Controls -->
  <div id="touch-controls">
    <div class="btn-group left-group">
      <button class="btn touch-btn" id="btn-left">◀</button>
      <button class="btn touch-btn" id="btn-right">▶</button>
    </div>
    <div class="btn-group right-group">
      <button class="btn pedal-btn brake" id="btn-brake">BRAKE</button>
      <button class="btn pedal-btn gas" id="btn-gas">GAS</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
